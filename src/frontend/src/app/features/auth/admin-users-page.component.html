<mat-card class="users-page">
  <mat-card-header>
    <mat-card-title>User Administration</mat-card-title>
    <mat-card-subtitle>Only Admin users can access this page.</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="createUserForm" (ngSubmit)="createUser()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="off" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          @for (role of roles; track role) {
            <mat-option [value]="role">{{ role }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <button mat-flat-button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creating...' : 'Create user' }}
      </button>

      @if (resultMessage()) {
        <p class="result">{{ resultMessage() }}</p>
      }
    </form>
  </mat-card-content>
</mat-card>
