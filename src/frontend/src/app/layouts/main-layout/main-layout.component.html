<div class="shell">
  <mat-toolbar class="topbar" [class.scrolled]="hasScrolled()">
    <div class="brand">Inventory Management</div>

    <nav class="nav-links">
      <a mat-button routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      @if (isAdmin()) {
        <a mat-button routerLink="/admin/users" routerLinkActive="active">Users</a>
      }
    </nav>

    <div class="session">
      <span>{{ currentUser()?.email }}</span>
      <button mat-stroked-button type="button" (click)="logout()">Logout</button>
    </div>
  </mat-toolbar>

  <main>
    <router-outlet />
  </main>
</div>
