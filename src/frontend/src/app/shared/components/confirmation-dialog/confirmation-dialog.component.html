<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" mat-dialog-close>Cancel</button>
  <button mat-flat-button type="button" [class.danger-action]="data.tone === 'danger'" (click)="confirm()">
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
